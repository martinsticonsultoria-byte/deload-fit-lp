# Terceira dobra — comparativo "Antes vs deLoad.fit". Os ícones vêm de uma
# lista fechada (o mesmo conjunto do sprite da página) para o cliente nunca
# escolher um nome que não existe e ficar com o quadradinho vazio. Os rótulos
# de coluna (col_before_tag/col_after_tag) e o botão não têm campo de
# tamanho — são pílulas de forma fixa.
