# Quarta dobra — bento de inteligência clínica. Os 5 cards têm gráficos e
# animações em SVG que continuam fixos no template (curva, radar, órbitas);
# só os textos são editáveis aqui. Os números que alimentam os contadores
# animados (valor_kg, valor_percentual, valor_ldl, itens[].percentual) ficam
# como número puro, sem formatação — são lidos pelo JavaScript do contador,
# não só exibidos como texto. Os eixos do radar (Dieta/Treino/Sono/Pressão/
# Exames/Medidas) também ficam fixos: a posição de cada palavra é calculada
# para o desenho do hexágono, mudar o texto ali sem mudar a posição desalinha.
