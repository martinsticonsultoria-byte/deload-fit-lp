# Sétima dobra — FAQ. A mesma lista alimenta o accordion visível e o
# schema FAQPage (dado estruturado que o Google lê); o schema usa só o
# texto puro de cada campo (.texto), sem negrito/itálico — dado estruturado
# não aceita HTML.
label:
  texto: Dúvidas
  negrito: false
  italico: false
  sublinhado: false
title:
  texto: 'Perguntas que '
  tamanho: '100'
  negrito: false
  italico: false
  sublinhado: false
title_gradient:
  texto: a gente sempre responde.
  tamanho: '100'
  negrito: false
  italico: false
  sublinhado: false
items:
  - question:
      texto: Como migro meus pacientes de outra plataforma?
      tamanho: '100'
      negrito: false
      italico: false
      sublinhado: false
    answer:
      texto: Aos poucos, e é melhor assim. Você entra pelos pacientes novos e pelos que estão renovando — cada um migra quando o plano dele vence, sem fim de semana perdido. Suas dietas e treinos você monta uma vez, salva como modelo e reutiliza para sempre.
      tamanho: '100'
      negrito: false
      italico: false
      sublinhado: false
  - question:
      texto: O que conta como paciente ativo?
      tamanho: '100'
      negrito: false
      italico: false
      sublinhado: false
    answer:
      texto: Quem tem plano vigente com você. Venceu, saiu da conta.
      tamanho: '100'
      negrito: false
      italico: false
      sublinhado: false
  - question:
      texto: E se eu passar do limite da minha faixa?
      tamanho: '100'
      negrito: false
      italico: false
      sublinhado: false
    answer:
      texto: Avisamos antes. Nada trava no meio de um atendimento e nada é cobrado sem você aprovar.
      tamanho: '100'
      negrito: false
      italico: false
      sublinhado: false
  - question:
      texto: Meu paciente paga alguma coisa?
      tamanho: '100'
      negrito: false
      italico: false
      sublinhado: false
    answer:
      texto: Não. O app dele está incluso em qualquer plano.
      tamanho: '100'
      negrito: false
      italico: false
      sublinhado: false
  - question:
      texto: Preciso de cartão para testar?
      tamanho: '100'
      negrito: false
      italico: false
      sublinhado: false
    answer:
      texto: Não. Sete dias com acesso completo, sem cadastro de pagamento.
      tamanho: '100'
      negrito: false
      italico: false
      sublinhado: false
  - question:
      texto: Meus dados e os dos meus pacientes ficam seguros?
      tamanho: '100'
      negrito: false
      italico: false
      sublinhado: false
    answer:
      texto: Sim. Os dados são armazenados com criptografia e o tratamento segue a LGPD. Você é o responsável pelos dados dos seus pacientes e pode exportá-los ou excluí-los quando quiser.
      tamanho: '100'
      negrito: false
      italico: false
      sublinhado: false
  - question:
      texto: O deLoad.fit funciona no celular, entre consultas?
      tamanho: '100'
      negrito: false
      italico: false
      sublinhado: false
    answer:
      texto: Sim. O painel do profissional é responsivo e funciona em qualquer navegador de celular, tablet ou computador — sem precisar instalar nada.
      tamanho: '100'
      negrito: false
      italico: false
      sublinhado: false
