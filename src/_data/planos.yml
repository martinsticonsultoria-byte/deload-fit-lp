# Sexta dobra — preços. O cliente só edita "mensal" e "anual" (números
# puros, sem formatação) de cada plano; o texto "Cobrado R$X uma vez no
# ano · você economiza R$Y" é CALCULADO no build a partir desses dois
# números, então nunca fica com um preço novo e um texto de economia
# antigo. Rótulos pequenos (toggle_*, limit_prefix, cta, badge) não têm
# campo de tamanho — são pílulas de forma fixa.
