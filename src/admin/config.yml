# Cada campo de texto normal vira um pequeno formulário: Texto + Tamanho +
# Negrito + Itálico + Sublinhado — os quatro ajustes são independentes e
# combinam entre si. Botões, selos e rótulos pequenos (marcados nas dicas
# abaixo) não têm ajuste de Tamanho: são elementos de forma fixa (pílula),
# aumentar o texto sozinho estouraria a borda — mas negrito/itálico/
# sublinhado continuam disponíveis neles.
backend:
  name: git-gateway
  branch: main
publish_mode: simple
locale: pt
site_url: https://deloadfit.netlify.app/
display_url: https://deloadfit.netlify.app/
media_folder: src/assets/images/uploads
public_folder: /assets/images/uploads
collections:
  - name: paginas
    label: Página
    files:
      - file: src/_data/aparencia.yml
        label: ⚙ Aparência (afeta a página toda)
        name: aparencia
        fields:
          - label: Tamanho do texto — geral
            name: tamanho_fonte
            widget: select
            hint: Multiplica o tamanho de TODA a página de uma vez. Some-se ao tamanho individual de cada campo (abaixo, em cada seção) — os dois efeitos se combinam.
            options:
              - label: Pequeno
                value: '90'
              - label: Padrão (recomendado)
                value: '100'
              - label: Grande
                value: '112'
              - label: Extra grande
                value: '125'
      - file: src/_data/links.yml
        label: ⚙ Contato e links
        name: links
        fields:
          - label: Link do "Começar grátis" (cadastro no app)
            name: signup
            widget: string
            pattern:
              - ^https?://.+
              - Precisa começar com http:// ou https://
          - label: 'WhatsApp (só números, com DDI e DDD — ex.: 5549991566172)'
            name: whatsapp
            widget: string
            required: false
            pattern:
              - ^\d{10,13}$
              - 'Só números, com código do país. Ex.: 5549991566172'
          - label: E-mail de suporte
            name: email
            widget: string
            required: false
            pattern:
              - ^[^@\s]+@[^@\s]+\.[^@\s]+$
              - Não parece um e-mail válido
          - label: Link da App Store
            name: app_store
            widget: string
            required: false
            pattern:
              - ^https?://.+
              - Precisa começar com http:// ou https://
          - label: Link do Google Play
            name: play_store
            widget: string
            required: false
            pattern:
              - ^https?://.+
              - Precisa começar com http:// ou https://
          - label: Link do Instagram
            name: instagram
            widget: string
            required: false
            pattern:
              - ^https?://.+
              - Precisa começar com http:// ou https://
          - label: Link dos Termos de Uso
            name: termos
            widget: string
            required: false
            pattern:
              - ^https?://.+
              - Precisa começar com http:// ou https://
          - label: Link da Política de Privacidade
            name: privacidade
            widget: string
            required: false
            pattern:
              - ^https?://.+
              - Precisa começar com http:// ou https://
          - label: Link de Tratamento de dados (LGPD)
            name: lgpd
            widget: string
            required: false
            pattern:
              - ^https?://.+
              - Precisa começar com http:// ou https://
      - file: src/_data/hero.yml
        label: 1 · Topo da página
        name: hero
        fields:
          - label: Frase pequena acima do título
            name: eyebrow
            widget: object
            hint: Tamanho, negrito, itálico e sublinhado — cada opção é independente, pode combinar.
            fields:
              - label: Texto
                name: texto
                widget: string
              - &ref_0
                label: Tamanho
                name: tamanho
                widget: select
                options:
                  - label: Menor
                    value: '90'
                  - label: Padrão
                    value: '100'
                  - label: Maior
                    value: '112'
                  - label: Bem maior
                    value: '125'
                default: '100'
              - &ref_1
                label: Negrito
                name: negrito
                widget: boolean
                default: false
              - &ref_2
                label: Itálico
                name: italico
                widget: boolean
                default: false
              - &ref_3
                label: Sublinhado
                name: sublinhado
                widget: boolean
                default: false
          - label: Título principal — linha 1
            name: title_line1
            widget: object
            hint: Tamanho, negrito, itálico e sublinhado — cada opção é independente, pode combinar.
            fields:
              - label: Texto
                name: texto
                widget: string
              - *ref_0
              - *ref_1
              - *ref_2
              - *ref_3
          - label: Título principal — linha 2 (fica azul)
            name: title_gradient
            widget: object
            hint: Tamanho, negrito, itálico e sublinhado — cada opção é independente, pode combinar.
