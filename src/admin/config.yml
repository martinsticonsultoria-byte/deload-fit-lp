              - *ref_0
              - *ref_1
              - *ref_2
              - *ref_3
          - label: Botão principal
            name: cta_primary
            widget: object
            hint: 'Negrito, itálico e sublinhado — cada opção é independente, pode combinar. Sem opção de tamanho: é um elemento pequeno de forma fixa (botão, selo ou rótulo), aumentar o texto sozinho estouraria a borda.'
            fields:
